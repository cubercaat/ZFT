# Instagram va TikTok videoni shu manzildan yuklab oladi.
# DNS: media.chorrahaa.uz → serveringiz IP (A yozuv). Keyin:  sudo certbot --nginx -d media.chorrahaa.uz
server {
    listen 80;
    server_name media.chorrahaa.uz;

    location / {
        root /opt/zft/data/media;
        autoindex off;              # fayllar ro'yxati ko'rinmaydi
        types { video/mp4 mp4; }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400";
        limit_except GET HEAD { deny all; }
    }
}

# Boshqaruv paneli. DNS: panel.chorrahaa.uz → server IP.  Keyin:  sudo certbot --nginx -d panel.chorrahaa.uz
server {
    listen 80;
    server_name panel.chorrahaa.uz;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
